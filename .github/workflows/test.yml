name: Formula
on: [push, pull_request]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478
        with:
          stable: true
      - name: Install the checked-out formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install youssef-tharwat/tap/agent-mail
          brew test youssef-tharwat/tap/agent-mail
