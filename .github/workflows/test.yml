name: Formula
on: [push, pull_request]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Install the checked-out formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew tap --custom-remote youssef-tharwat/tap "$GITHUB_WORKSPACE"
          brew install youssef-tharwat/tap/agent-mail
          brew test youssef-tharwat/tap/agent-mail
